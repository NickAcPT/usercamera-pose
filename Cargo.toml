[package]
name = "usercamera-pose"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
vrchat_osc = "2"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11.11"
log = "0.4.34"
axum = { version = "0.8.9", features = ["ws"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
spout-rs = { version = "0.2", features = ["vendored"] }
png = "0.18"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
